<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
    #wrap {
      max-width: 1200px;
      margin: 0 auto;
    }
    #map {
      width: 100%;
      height: 300px;
      border-radius: 12px;
      overflow: hidden;
      background: #e5e7eb;
    }
  </style>
</head>

<body>
  <div id="wrap">
    <div id="map"></div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);

      const lat = parseFloat(params.get("lat"));
      const lng = parseFloat(params.get("lng"));
      const radius = parseInt(params.get("r")) || 2500;

      if (!lat || !lng) {
        document.getElementById("map").innerHTML =
          "<div style='padding:16px;font-family:sans-serif;color:#555'>Map data not available</div>";
        return;
      }

      const map = L.map("map", {
        zoomControl: true,
        scrollWheelZoom: true,
        tap: true
      });

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }).addTo(map);

      const circle = L.circle([lat, lng], {
        radius: radius,
        color: "#111827",
        weight: 2,
        fillColor: "#111827",
        fillOpacity: 0.18,
        interactive: false
      }).addTo(map);

      map.fitBounds(circle.getBounds(), { padding: [20, 20] });

      // 🔥 FIX FOR IFRAMES (Softr, lazy load, etc)
      setTimeout(() => {
        map.invalidateSize();
      }, 300);
    })();
  </script>
</body>
</html>
